<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17191b">
<link rel="apple-touch-icon" sizes="180x180" href="/icon.svg">
<link rel="icon" type="image/png" sizes="180x180" href="/icon.svg">
<title>PSA Index</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{color-scheme:dark;--bg:#17191b;--surface:#1e2124;--surface2:#24282b;--line:#303639;--ink:#f1f3ef;--muted:#929b98;--soft:#c5ccc6;--accent:#c9f36b;--green:#a8e6a1;--amber:#f2c879;--red:#f08b8b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}body{font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}
.app{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 238px;max-width:1440px;margin:auto}
.rail{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);display:flex;align-items:center;flex-direction:column;padding:22px 0;gap:15px;background:#191b1d}
.logo{width:38px;height:38px;border-radius:12px;background:var(--accent);color:#17191b;display:grid;place-items:center;font-weight:700;font-size:18px;letter-spacing:-.08em;margin-bottom:24px}
.navbtn{width:40px;height:40px;border:0;border-radius:12px;background:transparent;color:#8e9793;display:grid;place-items:center;transition:.18s}
.navbtn.active,.navbtn:hover{background:#2a3025;color:var(--accent)}.navbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.railbottom{margin-top:auto}
.main{grid-column:1;padding:36px clamp(20px,4vw,54px) 50px;min-width:0}
.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:35px}
.eyebrow{font:12px 'DM Mono',monospace;letter-spacing:.17em;color:var(--muted);text-transform:uppercase}
.live{display:flex;align-items:center;gap:7px;font:10px 'DM Mono',monospace;color:#a8b1ac;letter-spacing:.1em}.dot{width:6px;height:6px;background:var(--accent);border-radius:50%;box-shadow:0 0 10px #c9f36b80}
h1{font-size:clamp(36px,5vw,58px);line-height:.98;letter-spacing:-.065em;margin:0;font-weight:700}
.headingrow{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin-bottom:27px}
.heading-note{color:var(--muted);font-size:12px;margin-top:9px}
.add{background:var(--accent);color:#17191b;border:0;border-radius:10px;padding:12px 17px;font-size:12px;font-weight:700;white-space:nowrap}
.controls{display:flex;gap:9px;align-items:center;margin-bottom:17px}
.search{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:12px 14px;font-size:12px;outline:none}
.search:focus,input:focus{border-color:#829c4a}
.sort{background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--soft);padding:11px 10px;font-size:11px;max-width:145px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 14px;color:var(--muted);font:9px 'DM Mono',monospace;letter-spacing:.04em}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:6px;height:6px;border-radius:50%;display:inline-block}
.countrow{display:flex;justify-content:space-between;align-items:center;padding:0 2px 10px;color:var(--muted);font:10px 'DM Mono',monospace;text-transform:uppercase;letter-spacing:.1em}
.cards{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:15px 16px;transition:border-color .18s}
.card:hover{border-color:#59634d}
.cardtop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.cardidentity{display:flex;gap:12px;align-items:center;min-width:0}
.cardthumb{width:48px;height:64px;object-fit:contain;background:#111416;border:1px solid #3b4243;border-radius:7px;flex:none}
@media(min-width:900px){.card{padding:24px 26px}.cardidentity{gap:22px}.cardthumb{width:132px;height:176px;border-radius:11px}.cardname{font-size:27px;line-height:1.25}.set{font-size:14px;margin-top:8px}.cardtop{align-items:center}.signal{font-size:11px;padding:8px 10px}.metrics{gap:14px;margin-top:20px}.metric{padding-top:12px}.metric span{font-size:11px}.metric b{font-size:22px;font-weight:600;margin-top:7px}.gap{font-size:17px;font-weight:600}.actions button{font-size:12px;padding:8px 12px}.cardbottom{margin-top:17px}}
.cardname{font-size:14px;font-weight:600;letter-spacing:-.025em;overflow-wrap:anywhere}.set{font-size:10px;color:var(--muted);margin-top:4px}
.signal{font:9px 'DM Mono',monospace;letter-spacing:.09em;padding:6px 8px;border-radius:6px;white-space:nowrap}
.signal.green{background:#26382a;color:var(--green)}.signal.lime{background:#303a20;color:var(--accent)}.signal.amber{background:#3b3322;color:var(--amber)}.signal.red{background:#3c292b;color:var(--red)}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.metric{border-top:1px solid #343a3c;padding-top:9px;min-width:0}
.metric span{display:block;color:var(--muted);font:10px 'DM Mono',monospace;text-transform:uppercase;letter-spacing:.08em}
.metric b{display:block;font-size:16px;font-weight:600;margin-top:6px;overflow-wrap:anywhere}
.metric.profit-gap b{color:var(--green)}
.cardbottom{display:flex;justify-content:space-between;align-items:center;margin-top:13px}
.gap{font:14px 'DM Mono',monospace;font-weight:600}.gap.green{color:var(--green)}.gap.lime{color:var(--accent)}.gap.amber{color:var(--amber)}.gap.red{color:var(--red)}
.actions{display:flex;gap:6px}.actions button{background:transparent;border:1px solid #3b4243;color:#b4bdb8;border-radius:7px;padding:6px 10px;font-size:10px}
.empty{padding:44px 20px;text-align:center;border:1px dashed #414849;border-radius:13px;color:var(--muted);font-size:12px}
.side{border-left:1px solid var(--line);padding:36px 19px;background:#191b1d;min-height:100vh}
.sidehead{font:10px 'DM Mono',monospace;letter-spacing:.15em;color:var(--muted);text-transform:uppercase;margin:0 0 18px}
.statbox{border:1px solid var(--line);border-radius:12px;padding:16px 14px;margin-bottom:9px;background:var(--surface)}
.statlabel{font:9px 'DM Mono',monospace;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.statvalue{font-size:29px;letter-spacing:-.06em;font-weight:600;margin-top:9px}.statunit{font-size:12px;color:var(--muted);font-weight:400}
.statbox.featured{border-color:#52613b;background:linear-gradient(145deg,#252d20,#202421)}
.statbox.featured .statvalue{color:var(--accent)}
.sidefoot{margin-top:25px;border-top:1px solid var(--line);padding-top:17px;color:#78817e;font-size:10px;line-height:1.6}
.side-actions{display:flex;flex-direction:column;gap:7px;margin-top:17px}
.side-actions button{background:transparent;border:1px solid var(--line);color:#aeb7b1;border-radius:9px;padding:10px 11px;text-align:left;font-size:10px}
dialog{width:calc(100% - 28px);max-width:440px;border:1px solid #424b48;border-radius:17px;background:#202426;color:var(--ink);padding:20px;box-shadow:0 25px 80px #000b}
dialog::backdrop{background:#080a0bcc;backdrop-filter:blur(5px)}
.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.modalhead h2{font-size:18px;margin:0;letter-spacing:-.04em}
.close{background:#303638;color:white;border:0;border-radius:8px;padding:8px 10px}
.field{display:flex;flex-direction:column;gap:7px;margin:13px 0}label{font:9px 'DM Mono',monospace;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.field input{background:#171a1c;border:1px solid #3b4442;border-radius:9px;padding:12px;color:white;font-size:15px;width:100%;outline:none}
.formbuttons{display:flex;gap:8px;margin-top:19px}.formbuttons button{flex:1;padding:12px;border-radius:9px;font-weight:700;border:0;font-size:12px}.cancel{background:#343b3b;color:white}.save{background:var(--accent);color:#17191b}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,15px);background:var(--accent);color:#17191b;padding:11px 16px;border-radius:30px;font-size:11px;font-weight:700;opacity:0;transition:.2s;z-index:9;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
.hidden{display:none!important}
@media(max-width:850px){.app{min-height:0;grid-template-columns:60px minmax(0,1fr);grid-template-rows:auto auto;align-content:start}.side{display:none}.sidehead,.sidefoot,.side-actions{display:none}.statbox{height:auto;min-height:0;align-self:start;margin:0;padding:8px 10px}.statlabel{font-size:8px}.statvalue{font-size:20px;margin-top:4px}.main{grid-column:2;grid-row:2;padding:14px 20px 40px}.rail{position:fixed;left:0;top:0;width:60px;height:100vh;grid-row:auto;z-index:5}.railstats{padding:0 5px;gap:6px}.railstat{padding:6px 2px}}
@media(max-width:520px){.app{grid-template-columns:52px minmax(0,1fr)}.rail{width:52px}.railstats{padding:0 4px;gap:5px}.railstat span{font-size:6px}.railstat b{font-size:14px}.rail{padding-top:16px}.logo{width:33px;height:33px;margin-bottom:16px}.navbtn{width:36px;height:36px}.side{display:none}.statbox{padding:7px 6px;border-radius:9px}.statlabel{font-size:7px;letter-spacing:.025em}.statvalue{font-size:17px;margin-top:3px}.main{padding:12px 13px 35px}.topline{margin-bottom:28px}.headingrow{margin-bottom:20px}.heading-note{display:none}.add{padding:11px 12px}.controls{gap:6px}.search{padding:11px 10px;font-size:11px}.sort{max-width:115px;font-size:10px;padding:10px 6px}.legend{gap:9px;font-size:8px}.card{padding:13px}.metrics{gap:6px}.metric b{font-size:14px}.metric span{font-size:9px}.cardname{font-size:13px}}

@media(max-width:899px){
 .card.has-photo{display:grid;grid-template-columns:88px minmax(0,1fr);grid-template-areas:"photo top" "metrics metrics" "bottom bottom";column-gap:12px;row-gap:0;align-items:stretch}
 .card.has-photo>.cardthumb{grid-area:photo;width:100%;height:112px;min-height:112px;max-height:112px;object-fit:contain;align-self:stretch;margin:0;border:1px solid var(--line);border-radius:8px;background:#111416;padding:5px}
 .card.has-photo>.cardtop{grid-area:top;align-items:center;min-width:0;padding:2px 0}
 .card.has-photo .cardidentity{min-width:0;align-items:center}
 .card.has-photo .cardname{font-size:16px;line-height:1.15}
 .card.has-photo .set{font-size:11px;margin-top:6px}
 .card.has-photo .signal{font-size:9px;padding:6px 7px}
 .card.has-photo>.metrics{grid-area:metrics;margin-top:12px}
 .card.has-photo>.cardbottom{grid-area:bottom;margin-top:10px}
}
@media(min-width:900px){
 .card{display:grid;grid-template-columns:210px minmax(0,1fr);grid-template-rows:auto auto auto;column-gap:0;padding:0;min-height:250px;overflow:hidden;align-items:stretch}
 .card.has-photo{grid-template-areas:"photo top" "photo metrics" "photo bottom"}
 .card:not(.has-photo){grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "metrics" "bottom"}
 .cardthumb{grid-area:photo;width:100%;height:100%;min-height:250px;max-height:none;object-fit:contain;align-self:stretch;border:0;border-right:1px solid var(--line);border-radius:0;background:#111416;padding:12px}
 .cardtop{grid-area:top;align-items:flex-start;padding:24px 30px 12px;gap:20px}
 .cardidentity{gap:0;align-items:flex-start;flex:1}
 .cardname{font-size:36px;line-height:1.12;font-weight:700;letter-spacing:-.035em}
 .set{font-size:21px;line-height:1.25;margin-top:9px;color:var(--muted)}
 .signal{font-size:17px;font-weight:700;letter-spacing:.08em;padding:12px 17px;border-radius:8px;flex:none}
 .metrics{grid-area:metrics;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin:0;padding:12px 30px 16px}
 .metric{padding-top:13px}
 .metric span{font-size:13px}
 .metric b{font-size:30px;font-weight:700;margin-top:9px}
 .metric.profit-gap b{color:var(--green)}
 .gap{font-size:23px;font-weight:700}
 .cardbottom{grid-area:bottom;display:flex;align-items:center;justify-content:space-between;margin:0;padding:12px 30px 22px}
 .actions button{font-size:13px;padding:9px 14px}
}


/* Theme switch */
.theme-toggle{width:44px;height:38px;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;overflow:hidden}
.dot{background:#a78bfa;box-shadow:0 0 10px #a78bfa80}
h1 span[style]{color:#a78bfa!important}
#totalCards,#strongCount{color:#a78bfa}
html[data-theme="light"]{color-scheme:light;--bg:#f1f0ec;--surface:#fffefa;--surface2:#e8e7e2;--line:#d5d3cc;--ink:#202124;--muted:#777873;--soft:#454743;--accent:#252628;--green:#287b4b;--amber:#a36a18;--red:#b33e3e}
html[data-theme="light"] body{background:var(--bg);color:var(--ink)}
html[data-theme="light"] .rail,html[data-theme="light"] .side{background:#e8e7e2}
html[data-theme="light"] .logo{background:#252628;color:#fffefa}
html[data-theme="light"] .navbtn{color:#666963}
html[data-theme="light"] .navbtn.active,html[data-theme="light"] .navbtn:hover{background:#d8d6cf;color:#202124}
html[data-theme="light"] .dot{background:#777;box-shadow:0 0 0 3px #7772}
html[data-theme="light"] h1 span[style]{color:#202124!important}
html[data-theme="light"] #totalCards,html[data-theme="light"] #strongCount{color:#202124}
html[data-theme="light"] .add,html[data-theme="light"] .save{background:#252628;color:#fffefa}
html[data-theme="light"] .search,html[data-theme="light"] .sort{background:#fffefa;color:#202124;border-color:#d5d3cc}
html[data-theme="light"] .card{background:#fffefa;border-color:#d5d3cc}
html[data-theme="light"] .card:hover{border-color:#99978e}
html[data-theme="light"] .metric{border-top-color:#dedcd5}
html[data-theme="light"] .cardthumb{background:#eeede8;border-color:#d5d3cc}
html[data-theme="light"] .signal.green{background:#e0efe4;color:#246b40}
html[data-theme="light"] .signal.lime{background:#e9e8e2;color:#33352f}
html[data-theme="light"] .signal.amber{background:#f4ead8;color:#8a5b13}
html[data-theme="light"] .signal.red{background:#f4e1df;color:#a33b36}
html[data-theme="light"] .actions button,html[data-theme="light"] .side-actions button{border-color:#d0cec7;color:#454743}
html[data-theme="light"] .statbox{background:#fffefa;border-color:#d5d3cc}
html[data-theme="light"] .statbox.featured{background:#e6e5df;border-color:#c9c7bf}
html[data-theme="light"] .statbox.featured .statvalue{color:#202124}
html[data-theme="light"] .railstat.featured{background:#252628;border-color:#252628}
html[data-theme="light"] .railstat.featured span,html[data-theme="light"] .railstat.featured b,html[data-theme="light"] .railstat.featured b small{color:#fffefa}
html[data-theme="light"] .sidefoot{color:#777873}
html[data-theme="light"] dialog{background:#fffefa;color:#202124;border-color:#d5d3cc;box-shadow:0 25px 80px #25262822}
html[data-theme="light"] dialog::backdrop{background:#20212466}
html[data-theme="light"] .close{background:#e8e7e2;color:#202124}
html[data-theme="light"] .field input{background:#f1f0ec;border-color:#d5d3cc;color:#202124}
html[data-theme="light"] .cancel{background:#e1e0da;color:#202124}
html[data-theme="light"] .toast{background:#252628;color:#fffefa}
html[data-theme="light"] .empty{border-color:#d0cec7}


.railstats{display:flex;flex-direction:column;gap:5px;width:100%;padding:0 5px}
.railstat{min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 2px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.railstat span{font:7px 'DM Mono',monospace;letter-spacing:.02em;color:var(--muted);white-space:nowrap}
.railstat b{font:600 16px 'Space Grotesk',sans-serif;color:#a78bfa;line-height:1.1}
.railstat small{font-size:10px;color:var(--muted)}
.railstat.featured{border-color:#52613b;background:#252d20}
.railstat.featured b{color:var(--accent)}

.railbottom{display:flex;flex-direction:column;align-items:center;gap:12px}
.navbtn.thumb-add{width:48px;height:48px;border-radius:15px;background:var(--accent);color:#17191b;box-shadow:0 5px 18px #0004}
.navbtn.thumb-add:hover{background:#d7ff82;color:#17191b;transform:translateY(-1px)}
.navbtn.thumb-add svg{width:23px;height:23px;stroke-width:2.3}
@media(max-width:850px){.rail{padding-bottom:calc(18px + env(safe-area-inset-bottom))}.navbtn.thumb-add{width:46px;height:46px}}

.theme-toggle{position:fixed;right:30px;bottom:calc(94px + env(safe-area-inset-bottom));z-index:30;box-shadow:0 5px 18px #0005;transition:transform .16s,background .16s,color .16s}
.theme-toggle:active{transform:scale(.94)}
.theme-toggle svg{width:20px;height:20px;display:block}
@media(max-width:520px){.theme-toggle{right:25px;bottom:calc(94px + env(safe-area-inset-bottom));width:42px;height:36px}}
/* Floating add-card action */
.floating-add{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom));z-index:20;width:60px;height:60px;border:0;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#17191b;box-shadow:0 8px 26px #0007;font:700 30px 'Space Grotesk',sans-serif;cursor:pointer}
.floating-add svg{width:27px;height:27px;stroke:currentColor;stroke-width:2.5;stroke-linecap:round}
.floating-add:active{transform:scale(.94)}
@media(max-width:520px){.floating-add{right:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:58px;height:58px}}


.brand-heading{display:flex;align-items:center;gap:15px;min-width:0}
.brand-heading .logo{width:38px;height:38px;border-radius:12px;background:var(--accent);color:#17191b;display:grid;place-items:center;font-weight:700;font-size:18px;letter-spacing:-.08em;flex:none;margin:0}
@media(max-width:520px){.brand-heading{gap:10px}.brand-heading .logo{width:33px;height:33px;font-size:16px}}

/* Compact collection stats in the page header; left navigation rail removed */
.headingrow{align-items:center}
.railstats{display:flex;flex-direction:row;gap:8px;width:auto;padding:0;flex:none}
.railstat{min-width:78px;padding:8px 10px;gap:3px;border-radius:9px}
.railstat span{font-size:8px;letter-spacing:.06em}
.railstat b{font-size:19px}
@media(max-width:850px){
 .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto;min-height:100vh}
 .main{grid-column:1;grid-row:1;padding:22px clamp(14px,4vw,24px) 40px}
 .headingrow{gap:10px;flex-wrap:wrap}
 .railstats{width:auto;padding:0;gap:6px}
 .railstat{min-width:70px;padding:7px 8px}
}
@media(max-width:520px){
 .main{padding:16px 13px 35px}
 .headingrow{align-items:center}
 .railstats{gap:5px}
 .railstat{min-width:62px;padding:6px 6px}
 .railstat span{font-size:7px}
 .railstat b{font-size:16px}
}
</style>
</head>
<body>
<div class="app">
<main class="main">
 <div class="topline"><span class="eyebrow">BUTCH COLLECTOR TOOLS / 01</span></div>
 <div class="headingrow"><div class="brand-heading"><div class="logo" aria-label="Butch Collector Tools">B.</div><h1>PSA Index<span style="color:var(--accent)">.</span></h1></div><div class="railstats" aria-label="Collection overview"><div class="railstat"><span>CARDS</span><b id="totalCards">0</b></div><div class="railstat featured"><span>AVG GAP</span><b id="averageGap">—<small>%</small></b></div></div></div>
 <div class="controls"><input class="search" id="search" type="search" placeholder="Search cards…" autocomplete="off"><select class="sort" id="sort" aria-label="Card order"><option value="profit">Highest Profit Gap</option><option value="newest">Newest</option><option value="oldest">Oldest</option></select></div>
 <div class="legend"><span><i style="background:var(--green)"></i>STRONG 100%+</span><span><i style="background:var(--accent)"></i>GOOD 50%+</span><span><i style="background:var(--amber)"></i>WATCH 20%+</span><span><i style="background:var(--red)"></i>LOW</span></div>
 <div class="countrow"><span>Tracked cards</span><span id="count">0 / 0</span></div>
 <div class="cards" id="list"></div>
</main>
<aside class="side">
 <div class="sidehead">Overview</div>
 <div class="sidefoot">Price gap is a comparison, not estimated profit. Fees, grading outcome and selling costs are not included.</div>
 <div class="side-actions"><button id="importBtn">↙ &nbsp; Import backup</button><button id="clearAll">⌫ &nbsp; Clear watchlist</button></div>
</aside>
</div>
<dialog id="modal"><form id="form"><div class="modalhead"><h2 id="modalTitle">Add card</h2><button class="close" type="button" id="close">✕</button></div><input type="hidden" id="editId">
<div class="field"><label for="name">Card name</label><input id="name" type="text" required maxlength="120" placeholder="Mega Charizard X ex"></div>
<div class="field"><label for="set">Set / variant</label><input id="set" type="text" maxlength="120" placeholder="Optional"></div>
<div class="field"><label for="raw">Raw price (£)</label><input id="raw" type="number" min="0.01" max="100000000" step="0.01" required inputmode="decimal" placeholder="420"></div>
<div class="field"><label for="psa10">PSA 10 reference (£)</label><input id="psa10" type="number" min="0" max="100000000" step="0.01" required inputmode="decimal" placeholder="1100"></div>
<div class="field"><label>Card image (optional)</label><button type="button" class="cancel" id="choosePhoto" style="padding:11px;border-radius:9px">＋ Choose image</button><input id="photoFile" type="file" accept="image/*" hidden><input id="imageUrl" type="hidden"><div id="photoStatus" style="font-size:10px;color:#a8e6a1;min-height:14px"></div></div>
<div class="formbuttons"><button type="button" class="cancel" id="cancel">Cancel</button><button class="save" type="button" id="saveCard">Save card</button></div></form></dialog>
<button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to light mode" title="Switch colour theme"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
<button class="floating-add" id="navAdd" type="button" title="Add card" aria-label="Add card"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<input class="hidden" type="file" id="importFile" accept=".json,application/json"><div class="toast" id="toast" role="status"></div>
<script>
(()=>{'use strict';
const KEY='psa_price_indicator_cards_v3', $=id=>document.getElementById(id);let cards=[],toastTimer;
const money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP',maximumFractionDigits:2}).format(Number(n)||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gap=c=>(Number(c.psa10)-Number(c.raw))/Number(c.raw)*100;
const valid=c=>c&&typeof c.name==='string'&&Number.isFinite(Number(c.raw))&&Number(c.raw)>0&&Number.isFinite(Number(c.psa10))&&Number(c.psa10)>=0;
function signal(c){let g=gap(c);return g>=100?['green','STRONG']:g>=50?['lime','GOOD']:g>=20?['amber','WATCH']:['red','LOW'];}
function notify(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2100);}
async function load(){try{const r=await fetch('/api/cards',{cache:'no-store'});if(!r.ok)throw new Error('load');const j=await r.json();cards=Array.isArray(j.cards)?j.cards.filter(valid):[];render();}catch(e){cards=[];render();notify('Could not load the shared watchlist. Refresh to retry.');}}
async function save(){try{const r=await fetch('/api/cards',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cards})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Save failed');try{localStorage.setItem(KEY,JSON.stringify(cards));}catch(_){}render();return true;}catch(e){alert(e.message||'Could not save to the shared watchlist. Please try again.');render();return false;}}
function render(){
 let q=$('search').value.trim().toLowerCase(),mode=$('sort').value,shown=cards.filter(c=>(c.name+' '+(c.set||'')).toLowerCase().includes(q));
 const createdAt=c=>Number(c.createdAt)||Number(String(c.id||'').match(/^c-(\d+)-/)?.[1])||0;
 if(mode==='newest')shown.sort((a,b)=>createdAt(b)-createdAt(a));
 else if(mode==='oldest')shown.sort((a,b)=>createdAt(a)-createdAt(b));
 else shown.sort((a,b)=>(Number(b.psa10)-Number(b.raw))-(Number(a.psa10)-Number(a.raw)));
 $('totalCards').textContent=cards.length;
 $('averageGap').innerHTML=(cards.length?(cards.reduce((s,c)=>s+gap(c),0)/cards.length).toFixed(0):'—')+'<span class="statunit">%</span>';
 $('count').textContent=shown.length+' / '+cards.length;
 if(!shown.length){$('list').innerHTML='<div class="empty">'+(cards.length?'No matching cards.':'Your watchlist is empty. Add a card to begin.')+'</div>';return;}
 $('list').innerHTML=shown.map(c=>{let [cl,label]=signal(c),g=gap(c),d=Number(c.psa10)-Number(c.raw),img=(typeof c.imageUrl==='string'&&(/^https?:\/\//i.test(c.imageUrl)||/^data:image\/(jpeg|png|webp|gif);base64,/i.test(c.imageUrl)))?`<img class="cardthumb" src="${esc(c.imageUrl)}" alt="${esc(c.name)}" loading="lazy" onerror="this.style.display='none'">`:'';return `<article class="card ${cl} ${img?'has-photo':''}">${img}<div class="cardtop"><div class="cardidentity"><div><div class="cardname">${esc(c.name)}</div>${c.set?`<div class="set">${esc(c.set)}</div>`:''}</div></div><span class="signal ${cl}">${label}</span></div><div class="metrics"><div class="metric"><span>Raw</span><b>${money(c.raw)}</b></div><div class="metric"><span>PSA 10</span><b>${money(c.psa10)}</b></div><div class="metric profit-gap"><span>Profit Gap value</span><b>${money(d)}</b></div></div><div class="cardbottom"><span class="gap ${cl}">${g>=0?'+':''}${g.toFixed(1)}% GAP</span><div class="actions"><button data-edit="${esc(c.id)}">Edit</button><button data-delete="${esc(c.id)}">Delete</button></div></div></article>`;}).join('');
}
function openAdd(){$('form').reset();$('editId').value='';$('photoStatus').textContent='';$('modalTitle').textContent='Add card';$('modal').showModal();}
function edit(id){let c=cards.find(x=>x.id===id);if(!c)return;$('editId').value=c.id;$('name').value=c.name;$('set').value=c.set||'';$('raw').value=c.raw;$('psa10').value=c.psa10;$('imageUrl').value=(c.imageUrl&&c.imageUrl.startsWith('data:'))?c.imageUrl:(c.imageUrl||'');$('photoStatus').textContent=c.imageUrl?'Image attached ✓':'No image selected';$('modalTitle').textContent='Edit card';$('modal').showModal();}
function exportData(){let blob=new Blob([JSON.stringify({app:'PSA Index',version:3,exportedAt:new Date().toISOString(),cards},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='psa-index-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Backup exported.');}
$('navAdd').onclick=openAdd;
$('choosePhoto').onclick=()=>$('photoFile').click();
$('photoFile').onchange=async e=>{
 const file=e.target.files&&e.target.files[0];if(!file)return;
 if(!file.type.startsWith('image/')){notify('Please choose an image.');return;}
 try{
  const dataUrl=await new Promise((resolve,reject)=>{
   const reader=new FileReader();reader.onerror=()=>reject(new Error('Read failed'));
   reader.onload=()=>{
    const img=new Image();img.onerror=()=>reject(new Error('Image failed'));
    img.onload=()=>{
     const max=700,scale=Math.min(1,max/Math.max(img.width,img.height));
     const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
     const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);
     resolve(canvas.toDataURL('image/jpeg',0.78));
    };img.src=reader.result;
   };reader.readAsDataURL(file);
  });
  $('imageUrl').value=dataUrl;$('photoStatus').textContent='Photo attached ✓ Tap Save card to keep it.';
  notify('Photo attached to this card. Save to finish.');
 }catch(err){notify('Could not read that photo. Try another image.');}
 finally{e.target.value='';}
};

// The former sidebar's info control was removed with the sidebar.
$('close').onclick=()=>$('modal').close();$('cancel').onclick=()=>$('modal').close();
$('search').oninput=render;$('sort').onchange=render;
$('list').onclick=e=>{let a=e.target.closest('[data-edit]'),d=e.target.closest('[data-delete]');if(a)edit(a.dataset.edit);if(d){let c=cards.find(x=>x.id===d.dataset.delete);if(c&&confirm('Delete '+c.name+' from the public shared watchlist?')){const old=cards;cards=cards.filter(x=>x.id!==c.id);save().then(ok=>{if(ok)notify('Card deleted for everyone.');else cards=old;});}}};
async function saveCard(){
 let name=$('name').value.trim(),rawText=$('raw').value.trim(),psaText=$('psa10').value.trim();
 let raw=Number(rawText),psa10=Number(psaText);
 if(!name){$('name').focus();notify('Enter a card name.');return;}
 if(!rawText||!Number.isFinite(raw)||raw<=0){$('raw').focus();notify('Enter a raw price above £0.');return;}
 if(psaText===''||!Number.isFinite(psa10)||psa10<0){$('psa10').focus();notify('Enter a valid PSA 10 price.');return;}
 let id=$('editId').value||'c-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);
 let imageUrl=$('imageUrl').value.trim();
 if(imageUrl&&!/^https?:\/\//i.test(imageUrl)&&!/^data:image\/(jpeg|png|webp|gif);base64,/i.test(imageUrl)){notify('Choose a photo or enter a direct image URL.');$('imageUrl').focus();return;}
 let existing=cards.find(x=>x.id===id);
 let c={id,createdAt:existing?.createdAt||Date.now(),name,set:$('set').value.trim(),raw,psa10,imageUrl};
 let i=cards.findIndex(x=>x.id===id);
 if(i<0)cards.push(c);else cards[i]=c;
 if(await save()){$('modal').close();notify(i<0?'Card added for everyone.':'Card updated for everyone.');}
}
$('saveCard').addEventListener('click',saveCard);
$('form').addEventListener('submit',e=>{e.preventDefault();saveCard();});
$('importBtn').onclick=()=>$('importFile').click();
$('importFile').onchange=async e=>{let f=e.target.files?.[0];if(!f)return;try{let j=JSON.parse(await f.text()),arr=Array.isArray(j)?j:j.cards;if(!Array.isArray(arr)||!arr.every(valid))throw 0;if(confirm('Import '+arr.length+' cards? This replaces the PUBLIC shared watchlist for everyone.')){const old=cards;cards=arr.map((c,i)=>({...c,id:String(c.id||'import-'+Date.now()+'-'+i)}));if(await save())notify('Backup imported for everyone.');else cards=old;}}catch(_){alert('This backup file could not be read.');}finally{e.target.value='';}};
$('clearAll').onclick=()=>{if(cards.length&&confirm('Delete EVERY card from the PUBLIC shared watchlist for everyone? This cannot be undone except from a backup.')){const old=cards;cards=[];save().then(ok=>{if(ok)notify('Public watchlist cleared.');else cards=old;});}};

const themeToggle=$('themeToggle');
function applyTheme(theme){
 document.documentElement.dataset.theme=theme;
 themeToggle.innerHTML=theme==='dark'?'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>';
 themeToggle.setAttribute('aria-label',theme==='dark'?'Switch to light mode':'Switch to dark mode');
 try{localStorage.setItem('butchCollectorTheme',theme);}catch(_){}
}
let savedTheme='dark';
try{savedTheme=localStorage.getItem('butchCollectorTheme')||'dark';}catch(_){}
applyTheme(savedTheme==='light'?'light':'dark');
themeToggle.onclick=()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');

render();load();
})();
</script>
</body></html>
